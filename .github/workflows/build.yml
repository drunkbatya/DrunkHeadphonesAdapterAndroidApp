name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: 'Decode keystore'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE=$(mktemp --suffix=.keystore -p "$GITHUB_WORKSPACE")
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "file=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: 'Build APK'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          docker build \
              --secret "id=keystore,type=file,src=${{ steps.keystore.outputs.file }}" \
              --secret "id=keystorepass,env=KEYSTORE_PASSWORD" \
              --output type=local,dest=./build .
          cp build/app-release.apk "build/${{ steps.name.outputs.name }}-${{ github.ref_name }}.apk"

      - name: 'Make release'
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          prerelease: true
          working_directory: build
          files: |
            "${{ steps.name.outputs.name }}-${{ github.ref_name }}.apk"

      - name: 'Remove keystore'
        if: always()
        run: |
          test -z "${{ steps.keystore.outputs.file }}" || rm -f "${{ steps.keystore.outputs.file }}"
